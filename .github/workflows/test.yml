name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
    paths:
      - '!README.md'


jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y llvm-18 clang-18 libc++-18-dev libc++abi-18-dev libunwind-18-dev python3-minimal libgoogle-perftools-dev libboost-container-dev python3-dev libbsd-dev

    - name: Cache Z3
      id: cache-z3
      uses: actions/cache@v4
      with:
        path: ~/z3
        key: z3-4.15.4-x64-glibc-2.39

    - name: Install Z3
      run: |
        if [ ! -d ~/z3 ]; then
          wget https://github.com/Z3Prover/z3/releases/download/z3-4.15.4/z3-4.15.4-x64-glibc-2.39.zip
          unzip z3-4.15.4-x64-glibc-2.39.zip
          mv z3-4.15.4-x64-glibc-2.39 ~/z3
        fi
        sudo cp ~/z3/bin/z3 /usr/local/bin/
        sudo cp ~/z3/bin/libz3.so /usr/local/lib/
        sudo cp ~/z3/bin/libz3.a /usr/local/lib/
        sudo cp -r ~/z3/include/* /usr/local/include/
        sudo ldconfig
    #   run: |
    #     wget https://apt.llvm.org/llvm.sh
    #     chmod +x llvm.sh
    #     sudo ./llvm.sh 12 all

    - name: get aflpp
      uses: actions/checkout@v4
      with:
        repository: AFLplusplus/AFLplusplus
        path: ${{ github.workspace }}/aflpp

    - name: configure
      run: CC=clang-18 CXX=clang++-18 cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install -DAFLPP_PATH=${{ github.workspace }}/aflpp -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

    - name: build
      run: CC=clang-18 CXX=clang++-18 cmake --build ${{ github.workspace }}/build

    - name: install
      run: CC=clang-18 CXX=clang++-18 cmake --install ${{ github.workspace }}/build

    - name: install lit
      run: pip install lit

    # tests/symsan only.  tests/fuzzing needs a *built* AFL++ (the checkout
    # above is for driver/aflpp's headers, and afl-clang-lto is a build
    # product), so those tests would report UNSUPPORTED here anyway -- naming
    # the suite says that on purpose instead of by accident, and keeps the merge
    # gate free of any toolchain this workflow does not build itself.
    - name: test
      run: lit --verbose tests/symsan
      working-directory: ${{ github.workspace }}/build
