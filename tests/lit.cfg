import os
import sys
import re
import platform

try:
  import lit.util
  import lit.formats
except ImportError:
  pass

config.name = "SymSan"
config.test_format = lit.formats.ShTest(execute_external=False)

config.suffixes = ['.c', '.cpp']
config.test_source_root = os.path.join(config.source_dir, "tests")

# One config for three suites, told apart by what they are allowed to depend on
# rather than by what they are about:
#
#   symsan/   symbolic execution and solving.  Nothing outside this tree: the
#             SymSan toolchain and the binaries it installs, and that is all.
#             This is what CI runs on every merge, so a new dependency here is
#             a new dependency for everyone.
#   fuzzing/  integration with a real fuzzer, which means its toolchain has to
#             be present to run them.  Every test here needs a REQUIRES: line
#             for the feature it depends on (currently 'aflpp'), and is skipped
#             rather than failed where that is absent.
#   ucsan/    reserved, and not a lit suite at all -- the UCSan tests explore
#             paths under their own harness.  Its lit.local.cfg makes lit walk
#             past the directory.
#
# Keeping the fuzzer-dependent ones in their own directory is the point: a
# REQUIRES: line is easy to forget, and forgetting it in symsan/ would put an
# external toolchain in the merge gate without anyone deciding to.


bin_dir = os.path.join(config.install_dir, "bin")
if not os.path.exists(bin_dir):
  lit_config.fatal("Cannot find install directory: {}".format(bin_dir))

if not os.path.exists(config.llvm_bin_dir):
  lit_config.fatal("Cannot find llvm tool directory: {}".format(config.llvm_bin_dir))

path = os.path.pathsep.join([
        config.llvm_bin_dir,
        config.environment['PATH']
      ])

config.environment['PATH'] = path

config.substitutions.append(('%ko-clang', os.path.join(bin_dir, "ko-clang")))
config.substitutions.append(('%ko-clangxx', os.path.join(bin_dir, "ko-clang++")))
config.substitutions.append(('%fgtest', os.path.join(bin_dir, "fgtest")))
config.substitutions.append(('%afltest', os.path.join(bin_dir, "afltest")))
config.substitutions.append(('%covcheck', os.path.join(bin_dir, "covcheck")))
config.substitutions.append(('%deathtest', os.path.join(bin_dir, "deathtest")))

# The middle step of the two-stage pipeline, spelled once.  A test that builds a
# SymSan binary out of an already-AFL++-instrumented module runs `opt` over that
# module with the taint pass and the abilists ko-clang's add_taint_pass() would
# have selected for it.  No driver does this yet -- the Magma fuzzer's
# instrument.sh spells the same flags by hand -- so it is written out here rather
# than in every test.  `opt` itself resolves through llvm_bin_dir on PATH.
lib_dir = os.path.join(config.install_dir, "lib", "symsan")
config.substitutions.append(
    ('%taint-opt',
     "opt -load-pass-plugin={0}/TaintPass.so -passes=taint"
     " -taint-abilist={0}/dfsan_abilist.txt"
     " -taint-abilist={0}/zlib_abilist.txt".format(lib_dir)))

# The python binding is always built -- bindings/python/CMakeLists.txt makes
# missing Python development headers a hard error -- but it is built against
# whatever interpreter cmake found, and only that one's ABI can load it.  lit
# runs under its own venv, so match the module's ABI tag against ours and let a
# test that drives it say `REQUIRES: pysymsan` rather than fail on an import
# error that has nothing to do with SymSan.
import glob
if glob.glob(os.path.join(lib_dir,
                          "symsan.{}-*.so".format(sys.implementation.cache_tag))):
  config.available_features.add('pysymsan')
  # The interpreter running lit, which is the one that just proved it can load
  # the module, plus the directory to load it from.
  config.substitutions.append(('%python', sys.executable))
  config.substitutions.append(('%pysymsan-path', lib_dir))

# A test that checks SymSan against the fuzzer needs the fuzzer's own
# toolchain: it builds the same source a second time with AFL++'s LTO
# instrumentation and compares what the two builds say about one run.  AFL++ is
# an optional dependency of this tree, so mark it as a feature and let those
# tests be skipped rather than fail where it is absent.
aflpp_path = getattr(config, 'aflpp_path', '')
if aflpp_path:
  afl_clang_lto = os.path.join(aflpp_path, "afl-clang-lto")
  afl_clang_fast = os.path.join(aflpp_path, "afl-clang-fast")
  afl_showmap = os.path.join(aflpp_path, "afl-showmap")
  if os.path.exists(afl_clang_lto) and os.path.exists(afl_showmap):
    config.available_features.add('aflpp')
    # Longest first: lit rewrites in list order, so '%afl-showmap' has to be
    # tried before any shorter substitution that is a prefix of it.
    config.substitutions.append(('%afl-clang-lto', afl_clang_lto))
    config.substitutions.append(('%afl-showmap', afl_showmap))
  # cmplog instrumentation is a separate feature because it needs a different
  # compiler driver: the LTO one cannot build the cmplog binary.
  if os.path.exists(afl_clang_fast):
    config.available_features.add('aflpp-cmplog')
    config.substitutions.append(('%afl-clang-fast', afl_clang_fast))

# The Rust fuzzer is built by cargo, not by cmake -- `make symsan-rust`, and
# only with -DSYMSAN_BUILD_RUST=ON -- so it may simply not be there.  Release
# first: it is what the cmake target builds by default, and what anyone timing
# a run would use.  A test that drives it needs `REQUIRES: symsan-fuzz`.
for _profile in ('release', 'debug'):
  symsan_fuzz = os.path.join(config.source_dir, "bindings/rust/target",
                             _profile, "symsan-fuzz")
  if os.path.exists(symsan_fuzz):
    config.available_features.add('symsan-fuzz')
    config.substitutions.append(('%symsan-fuzz', symsan_fuzz))
    break
